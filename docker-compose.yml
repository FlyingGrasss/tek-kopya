name: tek-kopya

services:
  app:
    build:
      context: .
    image: tek-kopya:latest
    environment:
      NODE_ENV: production
      API_PORT: "4700"
      APP_ORIGINS: "${APP_ORIGINS:?Set APP_ORIGINS to the public web origin}"
      DATA_DIR: /app/data
    ports:
      - "${HOST_PORT:-3000}:3000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:4700/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
